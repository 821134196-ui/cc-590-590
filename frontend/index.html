<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>企业招聘背调授权与结果封存系统</title>
  <style>
    :root {
      --primary: #2563eb; --primary-dark: #1d4ed8; --danger: #dc2626;
      --ok: #16a34a; --warn: #d97706; --bg: #f1f5f9; --card: #ffffff;
      --text: #1e293b; --muted: #64748b; --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; background: var(--bg); color: var(--text); }
    button { cursor: pointer; border: none; border-radius: 6px; padding: 7px 14px; font-size: 13px; background: var(--primary); color: #fff; }
    button:hover { background: var(--primary-dark); }
    button.ghost { background: #fff; color: var(--primary); border: 1px solid var(--primary); }
    button.danger { background: var(--danger); }
    button.warn { background: var(--warn); }
    button:disabled { background: #cbd5e1; cursor: not-allowed; }
    input, select, textarea { padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; width: 100%; }
    textarea { font-family: ui-monospace, monospace; }
    label { font-size: 12px; color: var(--muted); display: block; margin: 8px 0 3px; }
    .topbar { background: #0f172a; color: #fff; padding: 12px 24px; display: flex; align-items: center; gap: 16px; }
    .topbar h1 { font-size: 17px; font-weight: 600; }
    .topbar .who { margin-left: auto; font-size: 13px; color: #94a3b8; display: flex; gap: 12px; align-items: center; }
    .container { max-width: 1180px; margin: 20px auto; padding: 0 16px; }
    .tabs { display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }
    .tabs button { background: #e2e8f0; color: var(--text); border-radius: 8px 8px 0 0; padding: 9px 18px; }
    .tabs button.active { background: var(--card); color: var(--primary); font-weight: 600; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-bottom: 16px; }
    .card h3 { font-size: 15px; margin-bottom: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { color: var(--muted); font-weight: 500; font-size: 12px; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; background: #e2e8f0; }
    .tag.green { background: #dcfce7; color: var(--ok); }
    .tag.red { background: #fee2e2; color: var(--danger); }
    .tag.orange { background: #ffedd5; color: var(--warn); }
    .tag.blue { background: #dbeafe; color: var(--primary); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .muted { color: var(--muted); font-size: 12px; }
    .alert { padding: 10px 14px; border-radius: 8px; margin-bottom: 12px; font-size: 13px; }
    .alert.error { background: #fee2e2; color: #991b1b; }
    .alert.ok { background: #dcfce7; color: #166534; }
    .kv { font-size: 13px; line-height: 1.9; }
    .kv b { color: var(--muted); font-weight: 500; margin-right: 6px; }
    pre.payload { background: #0f172a; color: #a5f3fc; padding: 12px; border-radius: 8px; font-size: 12px; overflow: auto; max-height: 300px; }
    .timeline { border-left: 2px solid var(--border); margin-left: 8px; padding-left: 18px; }
    .timeline .ev { position: relative; margin-bottom: 14px; font-size: 13px; }
    .timeline .ev::before { content: ""; position: absolute; left: -24px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); }
    .checks-row { display: flex; flex-wrap: wrap; gap: 14px; }
    .checks-row label { display: flex; gap: 6px; align-items: center; margin: 0; color: var(--text); font-size: 13px; }
    .checks-row input { width: auto; }
    .login-box { max-width: 380px; margin: 100px auto; }
    .bell { position: relative; background: transparent; color: #fff; font-size: 16px; padding: 4px 8px; }
    .bell .n { position: absolute; top: -4px; right: -4px; background: var(--danger); border-radius: 50%; font-size: 10px; padding: 1px 5px; }
    .drawer { position: fixed; right: 0; top: 0; bottom: 0; width: 380px; background: #fff; box-shadow: -4px 0 16px rgba(0,0,0,.15); padding: 18px; overflow: auto; z-index: 50; }
    .modal-mask { position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 40; display: flex; align-items: center; justify-content: center; }
    .modal { background: #fff; border-radius: 12px; padding: 22px; width: 640px; max-width: 94vw; max-height: 88vh; overflow: auto; }
    .modal h3 { margin-bottom: 12px; font-size: 15px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="/static/vendor/vue.global.prod.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
